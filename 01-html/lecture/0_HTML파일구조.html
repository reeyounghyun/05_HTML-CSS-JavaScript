<!DOCTYPE html> <!-- 문서 유형 선언: HTML5 문서임을 나타냄 -->
<html lang="ko"> <!-- HTML 문서의 시작: 문서의 주 언어를 한국어로 설정. 화면낭독기와 번역기가 이 값을 참고한다. -->
<head>
	<!-- 문자 인코딩: UTF-8을 사용하여 다양한 문자를 지원 -->
	<meta charset="UTF-8"> 
	<!-- 반응형 웹 디자인을 위한 뷰포트 설정 -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
	<!-- 문서의 제목: 브라우저 탭에 표시됨 -->
	<title>HTML 파일 구조</title> 
</head>
<body>
	<!-- 본문 내용이 들어가는 부분 -->
</body>
</html>
