<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02_카운트다운 (타이머)</title>
    <style>
        #display {
            font-size: 3em;
            font-family: monospace;
        }

        #log {
            background: #f4f4f4;
            padding: 10px;
            min-height: 120px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <h1>02. 카운트다운</h1>

    <div id="display">10</div>
    <button id="startBtn">시작</button>
    <button id="stopBtn">일시정지</button>
    <button id="resetBtn">초기화</button>

    <h3>실행 결과</h3>
    <div id="log"></div>

    <script>
        /* 문제 02. setInterval 로 카운트다운 만들기
           유형 : 빈칸 채우기 | 난이도 : ★☆☆

           뼈대 코드는 이미 있다. TODO 자리에 한 줄씩만 채운다.

           [1] 시작 : 1초마다 남은 시간(remain)을 1 줄여 화면에 보여주고, 0 이 되면 스스로 멈춘다.
           [2] 일시정지 : 타이머를 멈춘다. 다시 시작을 누르면 멈춘 숫자부터 이어서 줄어든다.

           기대 (시작을 누른 뒤) :
           10 → 9 → 8 → ... → 1 → 0, log : 끝!

           참고 : lecture/03_web/02_timer/02_interval.html (시계 만들기 부분과 거의 같다)
        */

        const $log = document.getElementById('log');

        function log(message) {
            $log.insertAdjacentHTML('beforeend', `<div>${message}</div>`);
            console.log(message);
        }

        const $display = document.getElementById('display');

        let remain = 10;     // 남은 시간
        let timerId = null;  // 돌고 있는 타이머 id (없으면 null)

        // [1] 시작
        document.getElementById('startBtn').addEventListener('click', () => {
            if (timerId !== null) return;   // 이미 돌고 있으면 또 만들지 않는다 (빨라지는 것 방지)

            timerId = setInterval(() => {
                // TODO 1-1. remain 을 1 줄인다.
                remain--;

                // TODO 1-2. $display 에 remain 을 보여준다. (textContent)
                $display.textContent = remain;

                if (remain === 0) {
                    // TODO 1-3. 타이머를 멈춘다. (clearInterval)
                    clearInterval(timerId);

                    timerId = null;
                    log('끝!');
                }
            }, 1000);
        });

        // [2] 일시정지
        document.getElementById('stopBtn').addEventListener('click', () => {
            // TODO 2-1. 타이머를 멈춘다.
            clearInterval(timerId);

            timerId = null;
            log(`${remain}초에서 멈춤`);
        });

        /* [도전] 위를 다 풀었으면 해 보기
           1. 초기화 버튼(resetBtn) : 타이머를 멈추고 remain 을 10 으로 되돌려 화면에 보여준다.
           2. 0 이 되어 멈춘 뒤에 시작을 누르면 0 → -1 → -2 로 내려간다. 이걸 막아 본다.
              힌트 : 시작 버튼 맨 위에서 remain 이 0 이면 return 한다.
        */
    </script>

</body>

</html>
