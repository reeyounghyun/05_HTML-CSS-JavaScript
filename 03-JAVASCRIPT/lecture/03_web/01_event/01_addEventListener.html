<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01_이벤트 핸들러 등록</title>
    <style>
        #log {
            background: #f4f4f4;
            padding: 10px;
            min-height: 80px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <h1>01. 이벤트 핸들러 등록</h1>

    <button id="btn">눌러 보세요</button>

    <h3>실행 결과</h3>
    <div id="log"></div>

    <script>
        // $ : DOM 요소가 들어있는 변수라는 표시
        const $log = document.getElementById('log');

        /** insertAdjacentHTML가 미리 정해 둔 위치 이름
         * beforebegin : 오소 바깥, 앞 // 시작 태그 <div> 앞
         * afterbegin : 요소 안, 맨 앞 // 시작 태그 바로 뒤
         * beforeend : 요소 안 , 맨 뒤 // 끝 태그 <div> 바로 앞
         * afterend : 요소 바깥, 뒤 // 끝 태그 뒤
        */
        function log(message) {
            $log.insertAdjacentHTML('beforeend', `<div>${message}</div>`);
            console.log(message);
        }

        /**
         * 이벤트 핸들러
         * - 특정 이벤트가 발생하면 이 함수를 호출해 달라고 맡기는 함수이다.
         * - 이 함수는 => 브라우저가 호출한다.
         * **/
        // 1. 요소를 찾고
        const $btn = document.getElementById("btn");
        // console.log($btn);

        // 2. 이벤트를 등록한다 (어떤 이벤트로, () => log(어떤 작업을 할 것인지[콜백]))
        //$btn.addEventListener('click', () => log())
        $btn.addEventListener('click', () => log('첫번째 핸들러'))
        $btn.addEventListener('click', () => log('두번째 핸들러'))

        function handleMouseOver() {
            log('마우스가 올라왔습니다.')
        }

        $btn.addEventListener("mouseover", handleMouseOver)
        // 옛날 방식
        //   $btn.onclick = () => {
        //     log("첫번째 핸들러");
        //   };
    </script>

</body>

</html>
