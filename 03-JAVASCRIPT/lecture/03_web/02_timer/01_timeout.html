<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01_setTimeout</title>
    <style>
        #log {
            background: #f4f4f4;
            padding: 10px;
            min-height: 120px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <h1>01. setTimeout</h1>

    <button id="startBtn">실행하기</button>

    <h3>실행 결과</h3>
    <div id="log"></div>

    <script>
        const $log = document.getElementById('log');

        function log(message) {
            const time = new Date().toLocaleTimeString('ko-KR');
            $log.insertAdjacentHTML('beforeend', `<div>[${time}] ${message}</div>`);
            console.log(message);
        }

        /*
        자바스크립트 -> 싱글스레드
        한번에 하나의 일만 처리
        - 동기   -> 앞의 일이 끝나야 다음 일을 한다.
        - 비동기 -> 맡겨두고 다음일을 한다. (외부API요청,이벤트핸들러,setTimeout)
        */
        document.getElementById('startBtn').addEventListener('click', () => {

            // setTimeout(콜백 함수, 지연 시간)
            // - 지정한 시간이 지난 뒤 콜백을 한 번 호출
            setTimeout(() => log("1초가 지났다."), 1000);
            setTimeout(() => log("3초가 지났다."), 3000);

            setTimeout(() => log("0으로 등록한것."), 0);

            log("--- 여기까지 실행");
        });

    </script>

</body>

</html>
