<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body>
  <h1>모듈 실행해보기</h1>
  <div id="output"></div>

  <!-- Javascript에서 import를 사용하기 위해 -->
  <!--type="module" => 이 스크립트는 모듈이니까 모듈 규칙으로 실행해 -->
  <!--
    script type=module
    ES모듈로 실행하라고 브라우저에 알려주는 표시
    -->
  <script type="module">
    // import { PI, add, internalNote } from "./math.js";
    // 이름 내보내기 : 중괄호로 가져오고 이름이 일치해야한다.
    import { PI, add, subtract } from "./math.js";

    // default export : 중괄호가 없이, 이름을 마음대로
    import sayHello, { LANG } from "./greeting.js";

    // 화면에 출력할 요소를 선택
    const output = document.getElementById("output");

    // 결과를 담을 배열
    const result = [
      `PI = ${PI}`,
      `add(3,4) = ${add(3, 4)}`,
      `sayHello('홍길동') = ${sayHello("홍길동")}`,
      `LANG = ${LANG}`,
    ]; // 결과: ["PI = 3.14", "add(3,4) = 7", "sayHello('홍길동') = 안녕하세요, 홍길동님~!", "LANG = ko"]

    // forEach 배열의 요소를 처음부터 하나씩 꺼내서, 매번 같은 일을 시킬 때 사용
    result.forEach((line) => {
      // HTML 요소만들기
      const p = document.createElement("p");

      // p태그 안에 글자를 넣기
      p.textContent = line;

      // output 요소에 P태그 추가
      output.appendChild(p);
      console.log(`요소추가: ${line}`); // 결과: 요소추가: PI = 3.14 / 요소추가: add(3,4) = 7
    });

    // console.log(`internalNote : ${internalNote}`); // 결과: export 안해서 못가져옴

    // var modulerVar = "이 변수는 이 모듈 안에서만 유효";
    // console.log(window.modulerVar); // 결과: undefined (모듈의 var는 전역(window)에 안 붙음)
  </script>
</body>

</html>
