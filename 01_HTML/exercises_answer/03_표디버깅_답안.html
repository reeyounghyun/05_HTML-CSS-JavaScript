<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[답안] 표 디버깅 - 성적표</title>
</head>

<!--
================================================================================
 03. 표 디버깅 [답안]

  [칸 수 세기 결과]  (모든 행이 5칸이어야 한다)

    행          수정 전   내역                                      수정 후
    ─────────────────────────────────────────────────────────────────────
    제목 행       5      th 5개                                      5  (정상)
    중간고사 행   6      김철수1 + 중간고사1 + colspan2 + 1 + 1       5
    기말고사 행   4      (내려온칸)1 + 기말고사1 + 1 + 1              5
    평균 행       6      (내려온칸)1 + 김철수1 + 평균1 + 1 + 1 + 1    5
    이영희 행     5      td 5개                                      5  (정상)
    합계 행       2      총점1 + 531                                 5

  [원인 요약]
    증상 1  중간고사 행이 6칸 : "90"에 불필요한 colspan="2"가 붙어 있었다.
    증상 2  기말고사 행이 4칸 : JS 점수 td가 통째로 빠져 있었다.
    증상 3  평균 행이 6칸    : rowspan으로 이미 내려온 자리에 "김철수"를 또 썼다.
    증상 4  합계 행이 2칸    : colspan이 없어서 남은 칸을 채우지 못했다.

  표가 깨졌을 때의 진단은 언제나 같다. "각 행의 칸 수를 센다."
  눈으로 모양을 보는 것보다 숫자를 세는 쪽이 훨씬 빠르고 정확하다.
================================================================================
-->

<body>
    <h1>성적표</h1>

    <table border="1">
        <caption><b>1학기 성적표</b></caption>

        <thead>
            <tr>
                <th>이름</th>
                <th>구분</th>
                <th>HTML</th>
                <th>CSS</th>
                <th>JS</th>
            </tr>
        </thead>

        <tbody>
            <!-- [수정 1] "90"에 붙어 있던 colspan="2"를 제거했다.
                 colspan="2"는 가로 두 칸을 차지하라는 뜻이므로 이 행만 6칸이 되어 있었다.
                 병합할 이유가 없는 칸이었다.

                 rowspan="3"은 정상이다. 김철수는 중간고사/기말고사/평균 세 줄을 쓰기 때문이다. -->
            <tr>
                <td rowspan="3">김철수</td>
                <td>중간고사</td>
                <td>90</td>
                <td>85</td>
                <td>88</td>
            </tr>

            <!-- [수정 2] JS 점수 td를 추가했다.
                 이 행은 눈에 보이는 태그가 4개(기말고사, 95, 80, 87)이지만
                 왼쪽에 rowspan으로 내려온 김철수 칸이 자리를 차지하므로 합쳐서 5칸이 된다.

                 td가 모자라면 브라우저는 그 자리를 그냥 비워둔다. 오류를 내지 않는다.
                 그래서 "오른쪽 끝이 뚫려 보이는" 증상으로만 알 수 있다. -->
            <tr>
                <td>기말고사</td>
                <td>95</td>
                <td>80</td>
                <td>87</td>
            </tr>

            <!-- [수정 3] 중복으로 쓰인 "김철수" td를 제거했다.

                 이것이 rowspan에서 가장 많이 나오는 실수다.
                 위 행에서 rowspan="3"으로 내려온 칸이 이 행의 첫 자리를 이미 차지하고 있다.
                 그런데 코드만 보면 이 행에 이름 칸이 없어 허전해 보여서
                 무심코 "김철수"를 다시 쓰게 된다. 그러면 한 칸이 밀린다.

                 규칙: rowspan으로 덮인 행에서는 그 열의 td를 쓰지 않는다. -->
            <tr>
                <td>평균</td>
                <td>92</td>
                <td>82</td>
                <td>90</td>
            </tr>

            <!-- 이 행은 원래 정상이었다. 병합이 없으므로 td 5개가 그대로 5칸이다. -->
            <tr>
                <td>이영희</td>
                <td>중간고사</td>
                <td>88</td>
                <td>91</td>
                <td>79</td>
            </tr>
        </tbody>

        <!-- [수정 4] "총점"에 colspan="4"를 주어 앞의 네 칸을 덮게 했다.
             4 + 1 = 5칸으로 다른 행과 맞는다.
             합계 행처럼 "앞쪽은 설명, 끝에 숫자 하나"인 구조에서 늘 쓰는 방식이다. -->
        <tfoot>
            <tr>
                <td colspan="4">총점</td>
                <td>531</td>
            </tr>
        </tfoot>
    </table>

    <!-- [Tip] React 연결
         표 구조가 깨지는 문제는 React에서 오히려 더 자주 만난다.
         thead의 제목 칸은 손으로 쓰고, tbody의 내용 칸은 map으로 만들기 때문이다.
         열을 하나 추가할 때 한쪽만 고치고 다른 쪽을 빠뜨리면 바로 이 증상이 난다.

         오늘 익힌 "행마다 칸 수를 세어본다"는 방법이 그대로 통한다.
         AI에게도 이렇게 말할 수 있다.
           "thead는 5칸인데 tbody의 map에서 td를 4개만 만들고 있어. 한 칸 빠진 것 같아."
         이렇게 지목하면 AI가 정확히 그 부분만 고친다.

         참고로 JSX에서는 colspan이 아니라 colSpan으로 써야 한다. (rowspan도 rowSpan)
         소문자로 쓰면 적용되지 않고 콘솔에 경고가 뜬다. -->
</body>

</html>
