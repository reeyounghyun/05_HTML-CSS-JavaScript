<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[답안] 이미지와 링크 - 사진 갤러리</title>
</head>

<!--
================================================================================
 05. 이미지와 링크 - 사진 갤러리 만들기 [답안]
================================================================================
-->

<body>

    <!-- 해설 1. id="top"을 붙여두면 페이지 맨 아래에서 href="#top"으로 돌아올 수 있다. -->
    <h1 id="top">사진 갤러리</h1>

    <!-- 해설 2. href="#아이디명"은 같은 페이지 안에서 그 id를 가진 요소로 이동한다.
         이것을 앵커 링크라고 하며, 긴 문서의 목차를 만들 때 쓴다.
         주의할 점은 href에는 #을 붙이지만 id에는 붙이지 않는다는 것이다.
           href="#flower"  <->  id="flower"
         이 짝이 어긋나면 클릭해도 아무 일도 일어나지 않는다. 오류도 나지 않는다. -->
    <ul>
        <li><a href="#flower">꽃</a></li>
        <li><a href="#landscape">풍경</a></li>
        <li><a href="#architecture">건축</a></li>
    </ul>

    <hr>

    <h2 id="flower">꽃</h2>

    <!-- 해설 3. figure는 '본문에서 참조되는 독립적인 자료'를 나타내고,
         figcaption은 그 자료의 설명이다.
         이미지와 설명을 하나로 묶어주기 때문에, 단순히 img 아래 p를 쓰는 것보다
         둘의 관계가 명확해진다. 사진, 도표, 코드 예시 등에 쓴다.

         alt 속성은 이미지를 볼 수 없는 상황을 위한 대체 텍스트다.
           - 화면 낭독기가 이 문장을 읽어준다.
           - 이미지 로딩에 실패하면 이 글자가 대신 표시된다.
           - 검색 엔진이 이미지의 내용을 파악하는 근거가 된다.

         그래서 "이미지1", "사진" 같은 alt는 없는 것이나 마찬가지다.
         무엇이 찍혀 있는지를 구체적으로 적어야 한다. -->
    <figure>
        <img src="../sample/image/flower1.jpg" alt="분홍색 꽃잎이 활짝 핀 꽃 한 송이" width="300">
        <figcaption>봄에 촬영한 꽃 사진이다.</figcaption>
    </figure>

    <figure>
        <img src="../sample/image/flower2.jpg" alt="노란 들꽃이 무리지어 핀 모습" width="300">
        <figcaption>들판에서 촬영한 꽃 사진이다.</figcaption>
    </figure>

    <hr>

    <h2 id="landscape">풍경</h2>

    <!-- 해설 4. img를 a로 감싸면 이미지 전체가 클릭 가능한 링크가 된다.
         (반대로 a를 img로 감쌀 수는 없다. img는 내용을 담을 수 없는 빈 태그이기 때문이다)

         target="_blank"는 새 탭에서 열라는 뜻이다.
         외부 사이트로 나갈 때나 지금 페이지를 유지해야 할 때 쓴다.
         다만 남용하면 사용자가 원치 않는 탭이 계속 쌓이므로,
         같은 사이트 안의 이동에는 쓰지 않는 것이 보통이다.

         alt를 쓸 때 "클릭하면 원본이 열린다" 같은 동작 설명까지 넣을 필요는 없다.
         alt는 이미지의 내용을 설명하는 자리다. -->
    <figure>
        <a href="../sample/image/river1.jpg" target="_blank">
            <img src="../sample/image/river1.jpg" alt="숲 사이를 흐르는 강의 전경" width="300">
        </a>
        <figcaption>이미지를 클릭하면 새 탭에서 원본 크기로 볼 수 있다.</figcaption>
    </figure>

    <hr>

    <h2 id="architecture">건축</h2>

    <figure>
        <a href="../sample/image/tower1.jpg" target="_blank">
            <img src="../sample/image/tower1.jpg" alt="도심에 높이 솟은 타워 건축물" width="300">
        </a>
        <figcaption>이미지를 클릭하면 새 탭에서 원본 크기로 볼 수 있다.</figcaption>
    </figure>

    <hr>

    <!-- 해설 5. 맨 위의 h1에 붙여둔 id="top"으로 돌아가는 링크다. -->
    <p><a href="#top">맨 위로</a></p>

    <!-- 해설 6. 외부 사이트로 나가는 링크다.
         링크 글자는 "여기를 클릭"처럼 쓰지 않고, 어디로 가는지 알 수 있게 쓴다.
         화면 낭독기 사용자는 링크만 따로 모아서 듣는 경우가 있는데,
         "여기"만 잔뜩 나열되면 아무 정보가 되지 않기 때문이다. -->
    <p>
        HTML 태그를 더 찾아보려면
        <a href="https://developer.mozilla.org/ko/" target="_blank">MDN 웹 문서(새 탭)</a>를 참고한다.
    </p>

    <!-- [Tip] React 연결
         이미지와 링크는 React로 옮길 때 다뤄야 할 점이 조금 있다.

         1) 이미지 경로가 달라진다.
            지금처럼 ../sample/image/flower1.jpg 라고 쓰는 대신,
            Vite 프로젝트에서는 보통 이렇게 한다.
              import flower from './assets/flower1.jpg'
              <img src={flower} alt="..." />
            이렇게 하면 빌드할 때 경로가 자동으로 처리되고, 파일이 없으면 빌드 단계에서 오류가 난다.
            오타를 나중이 아니라 바로 잡을 수 있다는 뜻이다.

            "AI가 만들어 준 화면에서 이미지만 안 보여요"는 대부분 이 경로 문제다.
            F12 콘솔에서 404가 뜨는지 먼저 확인하는 습관이 그대로 통한다.

         2) 페이지 이동은 a 태그를 쓰지 않는다.
            React로 만든 화면에서 <a href="/about">을 쓰면 페이지가 통째로 새로고침되면서
            지금까지의 화면 상태가 전부 초기화된다.
            대신 React Router의 <Link to="/about">을 쓴다.

            다만 이 문제에서 쓴 앵커(#)와 외부 링크는 React에서도 a 태그를 그대로 쓴다.
            구분 기준은 "내 앱 안의 화면 이동인가, 아닌가"이다.

         3) alt는 React에서도 똑같이 필수다.
            빠뜨리면 개발 중에 경고가 뜨도록 설정된 프로젝트가 많다. -->
</body>

</html>
