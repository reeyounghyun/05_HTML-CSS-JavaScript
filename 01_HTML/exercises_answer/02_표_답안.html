<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[답안] 표 - 시간표 만들기</title>
</head>

<!--
================================================================================
 02. 표 - 주간 시간표 만들기 [답안]

  표에서 가장 중요한 감각은 "이 행의 실제 칸 수가 몇 개인가"를 세는 것이다.
  병합을 쓰면 태그 개수와 화면상 칸 수가 달라지기 때문이다.
================================================================================
-->

<body>

    <table border="1">

        <!-- 해설 1. caption은 표의 제목이다. table 바로 다음에 와야 하며,
             위치를 잘못 두면 브라우저가 표 밖으로 밀어내 버린다.
             제목을 p나 h3으로 표 위에 따로 쓰는 것과 달리,
             caption은 "이 표의 제목"이라는 의미가 붙기 때문에 화면 낭독기가 함께 읽어준다. -->
        <caption><b>AI 서빙 과정 주간 시간표</b></caption>

        <!-- 해설 2. thead / tbody / tfoot은 화면상으로는 거의 차이가 없지만
             "여기부터 제목, 여기부터 본문"이라는 의미를 표시한다.
             표가 길어서 인쇄가 여러 장으로 나뉠 때 thead가 페이지마다 반복되고,
             나중에 CSS나 JS로 본문 행만 골라 다룰 때도 기준이 된다. -->
        <thead>
            <tr>
                <th>교시</th>
                <th>월</th>
                <th>화</th>
                <th>수</th>
                <th>목</th>
            </tr>
        </thead>

        <tbody>
            <!-- 해설 3. colspan="2"는 가로로 두 칸을 차지하라는 뜻이다.
                 이 행을 보면 태그는 4개뿐이지만 실제 칸은 1 + 2 + 1 + 1 = 5칸이다.
                 "태그 수 != 칸 수"라는 점이 표에서 가장 헷갈리는 부분이다. -->
            <tr>
                <th>1교시</th>
                <td colspan="2">HTML</td>
                <td>CSS</td>
                <td>JS</td>
            </tr>

            <!-- 해설 4. rowspan="2"는 세로로 두 줄을 차지하라는 뜻이다.
                 여기서 내려간 칸이 다음 행의 자리를 미리 차지한다. -->
            <tr>
                <th>2교시</th>
                <td>CSS</td>
                <td>JS</td>
                <td rowspan="2">React</td>
                <td>JS</td>
            </tr>

            <!-- 해설 5. 이 행에는 수요일 칸이 없다.
                 위에서 rowspan으로 내려온 React가 이미 그 자리를 차지하고 있기 때문이다.
                 여기에 td를 하나 더 쓰면 이 행만 6칸이 되어 표가 오른쪽으로 삐져나온다.

                 이것이 표 작업에서 가장 흔한 실수다.
                 rowspan을 쓴 다음 행에서는 '내려온 칸만큼 td를 빼야 한다'를 기억한다. -->
            <tr>
                <th>3교시</th>
                <td>JS</td>
                <td>React</td>
                <td>프로젝트</td>
            </tr>
        </tbody>

        <!-- 해설 6. tfoot은 표의 요약이나 합계를 담는 영역이다.
             여기서는 colspan="4"로 남은 네 칸을 하나로 합쳤다.
             1(비고) + 4 = 5칸으로 다른 행과 칸 수가 맞는다. -->
        <tfoot>
            <tr>
                <th>비고</th>
                <td colspan="4">매일 9시 시작</td>
            </tr>
        </tfoot>
    </table>

    <!-- [Tip] React 연결
         표는 React에서 '데이터를 화면에 뿌리는' 대표적인 자리다.
         AI에게 "데이터 목록을 표로 보여줘"라고 하면 대개 이런 코드가 나온다.

           <tbody>
             {students.map((s) => (
               <tr key={s.id}>
                 <td>{s.name}</td>
                 <td>{s.score}</td>
               </tr>
             ))}
           </tbody>

         이때 알아둘 것 두 가지.

         1) 칸 수가 안 맞는 버그는 React에서 더 자주 난다.
            thead의 th는 손으로 쓰고 tbody의 td는 map으로 만들기 때문에,
            나중에 열을 하나 추가하면 한쪽만 고치고 다른 쪽을 빠뜨리기 쉽다.
            "표가 한 칸 밀렸어요"의 원인은 거의 항상 이것이다.

         2) colspan은 JSX에서 colSpan으로 쓴다. (rowspan도 rowSpan)
            JSX의 속성은 카멜 표기법을 쓰기 때문이다. class가 className이 되는 것과 같은 이유다.
            소문자로 쓰면 동작하지 않고 콘솔에 경고가 뜬다. -->
</body>

</html>
