<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .mark {
            background: #cfe8ff;
            border: 1px solid #1565c0;
        }

        .sized {
            width: 300px;
            height: 60px;
            background: #ffe0b2;
            border: 1px solid #e65100;
        }
    </style>
    <title>[답안] 영역 - block과 inline 설명하기</title>
</head>

<!--
================================================================================
 04. 영역 - div와 span, block과 inline 설명하기 [답안]
================================================================================
-->

<body>
    <h1>블록과 인라인</h1>

    <h3>관찰 1. div 세 개</h3>
    <div class="mark">첫 번째 div</div>
    <div class="mark">두 번째 div</div>
    <div class="mark">세 번째 div</div>

    <!--
      [관찰 1 해설]
        Q1. 세로로 하나씩 쌓인다.
            블록 레벨 요소는 항상 새로운 줄에서 시작하고, 다음 요소도 아래로 밀어낸다.

        Q2. 블록 레벨 요소는 너비를 지정하지 않으면 부모의 가로 폭을 전부 차지하기 때문이다.
            글자는 짧아도 요소 자체는 한 줄을 통째로 점유한다.
            배경색을 칠해보거나 F12 개발자 도구에서 요소를 선택(Ctrl + Shift + C)하여 확인해볼 수 있다.
    -->

    <hr>

    <h3>관찰 2. span 세 개</h3>
    <span class="mark">첫 번째 span</span>
    <span class="mark">두 번째 span</span>
    <span class="mark">세 번째 span</span>

    <!--
      [관찰 2 해설]
        Q1. 가로로 나란히 이어 붙는다. 줄이 꽉 차면 그때 다음 줄로 넘어간다.
            div가 무조건 줄을 바꾸는 것과 정반대다.

        Q2. 인라인 요소는 글자와 같은 취급을 받기 때문이다.
            글자 하나하나가 자기 모양만큼만 자리를 차지하듯,
            인라인 요소도 내용이 차지하는 만큼만 영역을 갖는다.

            참고로 span 사이에 미세한 간격이 보이는데, 이것은 margin이 아니라
            HTML 소스의 줄바꿈과 들여쓰기가 '공백 문자'로 해석된 결과다.
    -->

    <hr>

    <h3>관찰 3. 같은 크기를 준 div와 span</h3>
    <p>아래 두 요소에는 똑같이 width: 300px, height: 60px을 주었다.</p>

    <div class="sized">크기를 준 div</div>
    <span class="sized">크기를 준 span</span>

    <!--
      [관찰 3 해설]
        Q1. 그렇다. div는 300 x 60 크기의 상자로 정확히 보인다.

        Q2. 아니다. span은 width와 height를 완전히 무시한다.
            F12로 확인하면 실제 너비는 글자 길이만큼이고 높이도 글자 높이만큼이다.
            (배경색이 위아래로 조금 삐져나와 보일 수는 있지만 실제 높이는 변하지 않는다.
             그래서 아래 요소를 밀어내지도 않는다)

        Q3. 인라인 요소는 '글자의 흐름' 안에 놓이는 요소이기 때문이다.
            문장 한가운데 있는 단어의 높이를 마음대로 바꾸면 줄 간격이 다 깨질 것이다.
            그래서 브라우저는 인라인 요소의 width와 height 지정을 무시한다.

            해결하려면 display 속성을 바꿔야 한다.
              - display: block        -> 줄을 바꾸면서 크기를 갖는다.
              - display: inline-block -> 옆으로 나란히 있으면서 크기도 갖는다. (자주 사용하는 방법)
    -->

    <hr>

    <h3>관찰 4. 문장 안에 섞어 쓰기</h3>
    <p>
        이 문장 중간에 <span class="mark">span</span>을 넣으면 흐름이 유지된다.
        하지만 이 문장 중간에
    <div class="mark">div</div>를 넣으면 어떻게 될까?
    </p>

    <!--
      [관찰 4 해설]
        Q1. div가 나오는 지점에서 문장이 끊기고 줄이 바뀐다.
            div 뒤의 내용도 또 다른 줄로 밀려난다. 한 문장이 세 덩어리로 쪼개져 보인다.
            근본적으로 p 태그 안에는 블록 레벨 요소가 들어갈 수 없다는 규칙이 있어서,
            브라우저가 div를 만나는 순간 p를 강제로 닫아버린다.
            F12로 확인해보면 우리가 쓴 것과 다른 구조로 바뀌어 있다.
            헷갈리는 점은 오류 메시지가 뜨지 않고 브라우저가 알아서 고쳐버린다는 것이다.

        Q2. 줄을 바꿔야 한다면 div, 아니라면 span을 쓴다.
              - div  : 영역을 나눌 때. 문단, 카드, 헤더처럼 '덩어리'를 만들 때 쓴다.
              - span : 문장 안의 일부만 다르게 다룰 때. 단어 하나만 색을 바꾸는 식.
    -->

    <hr>

    <h3>관찰 5. 정리</h3>

    <!--
      [관찰 5 해설]
        Q1.
            구분             |  블록 레벨 요소            |  인라인 요소
            ───────────────────────────────────────────────────────────────────────
            줄바꿈            |  항상 새 줄에서 시작       |  줄을 바꾸지 않고 이어짐
            차지하는 너비      |  부모의 가로 폭 전체       |  내용만큼만
            width/height 적용 |  적용된다                |  무시된다
            대표적인 태그      |  div, p, h1~h6, ul, li  |  span, a, img, strong, em

        Q2.
            블록   : p, div, h1, ul, li
            인라인 : span, a, img, strong

            img가 인라인이라는 점이 의외로 느껴질 수 있다.
            img나 input처럼 내용을 외부 파일에서 가져오는 인라인 요소는 예외적으로 크기를 가질 수 있다.
            이런 것을 대체 요소(replaced element)라고 하는데, 지금은 예외가 있다는 정도만 알아두면 된다.
    -->

    <!-- [Tip] React 연결
         React로 화면을 만들면 div가 정말 많이 생긴다.
         컴포넌트 하나가 여러 요소를 반환하려면 무언가로 감싸야 하기 때문이다.
         AI가 짜준 코드에서 div가 5겹, 6겹으로 중첩된 것을 자주 보게 된다.

         알아두면 좋은 것 두 가지.

         1) 의미 없이 감싸기만 할 때는 Fragment를 쓴다.
              <>  ...  </>
            div를 하나 덜 만들기 때문에 구조가 단순해진다.
            "왜 이건 div가 아니라 꺾쇠만 있지?" 싶을 때 이것이다.

         2) 레이아웃이 이상할 때 block/inline을 먼저 의심한다.
            "가로로 놓고 싶은데 자꾸 세로로 쌓여요"는
            블록 레벨 요소를 나열했기 때문인 경우가 대부분이다.
            요즘은 display: flex로 해결한다. (CSS 7-5번 파일)

            이 원인을 짚을 수 있으면 AI에게도 이렇게 말할 수 있다.
              "이 div들이 블록이라 세로로 쌓이는데, 부모에 flex를 주면 될까?"
            눈으로 보이는 화면상의 증상만 전달할 때보다 훨씬 정확하게 고쳐줄 것이다. -->
</body>

</html>
